<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanks | SnapAtoms</title>
  <meta name="description" content="Thanks for contacting SnapAtoms." />
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:30px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#fff;
      background:radial-gradient(circle at 75% 25%,rgba(86,180,255,.20),transparent 28rem),linear-gradient(135deg,#08131f,#0e2237 60%,#091421);
    }
    .container { width:min(100%,650px); text-align:center; }
    .logo { display:inline-flex; align-items:center; gap:12px; margin-bottom:38px; font-size:24px; font-weight:800; letter-spacing:-.03em; }
    .logo svg { width:42px; height:42px; }
    .blue { color:#45a5ff; }
    h1 { margin:0; font-size:clamp(48px,8vw,72px); line-height:1; letter-spacing:-.05em; }
    p { max-width:520px; margin:24px auto 0; color:#cbd5e1; font-size:18px; line-height:1.7; }
    .button { display:inline-flex; align-items:center; justify-content:center; margin-top:34px; padding:13px 22px; border-radius:10px; background:#2f80ed; color:#fff; text-decoration:none; font-size:14px; font-weight:700; transition:.2s ease; }
    .button:hover { background:#1f6fd3; transform:translateY(-1px); }
    .small { margin-top:50px; color:#64748b; font-size:13px; }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="4" fill="#2F80ED" />
        <ellipse cx="20" cy="20" rx="15" ry="6.5" stroke="#2F80ED" stroke-width="2" />
        <ellipse cx="20" cy="20" rx="15" ry="6.5" transform="rotate(60 20 20)" stroke="#56B4FF" stroke-width="2" />
        <ellipse cx="20" cy="20" rx="15" ry="6.5" transform="rotate(120 20 20)" stroke="#DBEAFE" stroke-width="2" />
      </svg>
      <span>Snap<span class="blue">Atoms</span></span>
    </div>
    <h1>Thanks.</h1>
    <p>Your message has been received. We'll review your inquiry and get back to you soon.</p>
    <a href="/" class="button">Back to SnapAtoms</a>
    <div class="small">SnapAtoms LLC</div>
  </main>
</body>
</html>
